<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edf3f3" />
    <meta name="description" content="FuturePath AI — From who you are today to where you can be in the AI era." />
    <link rel="icon" type="image/svg+xml" href="/demo_sdc/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Geist+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>FuturePath AI</title>
    <script>
      /* Before first paint: apply the saved theme so the page never flashes the wrong colours,
         and mark html.js so the app shell can stay hidden until its load animation is ready.
         The failsafe un-hides it after 4 s if the bundle never gets there. */
      (function (d) {
        d.classList.add('js')
        try {
          var pref = JSON.parse(localStorage.getItem('futurepath:theme') || '"system"')
          var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          d.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1517' : '#edf3f3'
        } catch (e) {}
        setTimeout(function () { d.classList.add('failsafe') }, 4000)
      })(document.documentElement)
    </script>

    <link rel="stylesheet" crossorigin href="/demo_sdc/assets/index-BdEaHC4Y.css">
  </head>

</html>
